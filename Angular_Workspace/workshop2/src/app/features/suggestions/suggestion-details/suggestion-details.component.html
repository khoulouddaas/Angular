<div class="page-wrapper">

  <div class="page-header">
    <h2 class="page-title">💡 Détails de la suggestion</h2>
    <a class="btn btn-back" routerLink="/suggestions">← Retour</a>
  </div>

  <div *ngIf="suggestion; else notFound" class="card">

    <div class="card-top">
      <div class="card-meta">
        <span class="cat-badge">{{ suggestion.category }}</span>
        <span class="date">{{ suggestion.date | date:'dd MMM yyyy' }}</span>
      </div>
      <span class="status-badge" [ngClass]="suggestion.status">
        {{ suggestion.status | uppercase }}
      </span>
    </div>

    <h3 class="title">{{ suggestion.title }}</h3>
    <p class="desc">{{ suggestion.description }}</p>

    <div class="likes-row">
      <span class="likes">👍 {{ suggestion.nbLikes }} likes</span>
    </div>

    <div class="card-actions">
      <a class="btn btn-details"
         [routerLink]="['/suggestions/edit', suggestion.id]">
        ✏️ Modifier
      </a>
      <button class="btn btn-delete" (click)="deleteSuggestion()">
        🗑 Supprimer
      </button>
    </div>

  </div>

  <ng-template #notFound>
    <div class="card not-found">
      <p>Suggestion introuvable.</p>
      <a class="btn btn-back" routerLink="/suggestions">← Retour à la liste</a>
    </div>
  </ng-template>

</div>
